[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # zbus_names, zvariant and zvariant_derive are unmaintained; zbus 6 absorbs them. We get
  # them through zbus 5 (kc-store, secret-service) and no zbus 6 path is available yet.
  { id = "RUSTSEC-2026-0370", reason = "zbus_names via zbus 5; drop when moving to zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zvariant via zbus 5; drop when moving to zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5; drop when moving to zbus 6" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace crates depend on each other by path and are never published
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
