"Add items and offer them to paired devices" = "항목을 추가하고 페어링한 기기에 제안"
"Offer selected sync items again" = "선택한 동기화 항목을 다시 제안"
"Remove items from this device's sync set, keeping their values" = "값은 남기고 이 기기의 동기화 대상에서 제외"
"Manage the paired devices used for sync" = "동기화할 페어링 기기 관리"
"Review proposals and held changes" = "제안과 보류된 변경 검토"
"Resolve a conflict with a new version" = "새 버전을 만들어 충돌 해결"
"Restore the recovery checkpoint" = "복구 기준점으로 되돌리기"
"Hold all incoming sync changes" = "들어오는 동기화 변경을 모두 보류"
"Resume sync after local confirmation" = "기기에서 확인한 뒤 동기화 재개"
"Sync state is unavailable or damaged; retry after checking the keychain and state directory." = "동기화 상태를 읽을 수 없거나 상태가 손상됐습니다. 키체인과 상태 폴더를 확인한 뒤 다시 시도하세요."
"Sync needs local confirmation." = "동기화하려면 이 기기에서 본인 확인이 필요합니다."
"Run this command at a terminal and confirm in the operating system." = "터미널에서 이 명령을 실행한 뒤 운영체제의 본인 확인을 완료하세요."
"Sync items must contain between 1 byte and 200 KiB." = "동기화할 값의 크기는 1바이트 이상, 200 KiB 이하여야 합니다."
"Sync storage is full; review pending items before retrying." = "동기화 저장 공간이 가득 찼습니다. 대기 중인 항목을 검토한 뒤 다시 시도하세요."
"Ignored a stale sync offer for {name}." = "{name}의 이전 세대 제안을 무시했습니다."
"Ignored signed approvals: Phase 1 requires local review." = "서명 승인을 무시했습니다. 1단계에서는 이 기기에서 직접 검토해야 합니다."
"Confirm sync changes ({n} items)." = "동기화 변경 {n}개를 확인하세요."
"Sync delivery is queued; run `kc sync` to retry." = "동기화 전송이 대기 중입니다. `kc sync`로 다시 시도하세요."
"Unknown sync peer: {label}." = "동기화할 기기를 찾을 수 없습니다: {label}."
"Only the device that created a change sends it; if it is lost, publish a new local change from a remaining copy." = "변경은 만든 기기에서만 전송합니다. 그 기기를 잃어버렸다면 남아 있는 사본으로 새 변경을 만들어 보내세요."
"Review sync changes." = "동기화 변경을 검토하세요."
"Review {name} from {peer}: current {current}, proposed {proposed}." = "{peer}에서 온 {name} 검토: 현재 지문 {current}, 제안 지문 {proposed}."
"Review sync: accept {accept}, reject {reject}." = "동기화 검토: {accept}개 수락, {reject}개 거절."
"Confirm the requested sync operation." = "요청한 동기화 작업을 확인하세요."
"Select sync items." = "동기화할 항목을 선택하세요."
"Run `kc sync rm {name}` before deleting this item." = "이 항목을 삭제하려면 먼저 `kc sync rm {name}`을 실행하세요."
"{sent} sent, {updated} updated, {conflict} conflict, {held} held" = "전송 {sent}개, 갱신 {updated}개, 충돌 {conflict}개, 보류 {held}개"
"Sync {name}: {result}." = "동기화 {name}: {result}."
