"Remove items from this device's sync set, keeping their values" = "Quitar elementos de la sincronización de este dispositivo y conservar sus valores"
"Manage the paired devices used for sync" = "Gestionar los dispositivos vinculados usados para sincronizar"
"Review proposals and held changes" = "Revisar propuestas y cambios retenidos"
"Resolve a conflict with a new version" = "Resolver un conflicto con una nueva versión"
"Restore the recovery checkpoint" = "Restaurar el punto de recuperación"
"Hold all incoming sync changes" = "Retener todos los cambios de sincronización entrantes"
"Resume sync after local confirmation" = "Reanudar la sincronización tras la confirmación local"
"Sync state is unavailable or damaged; retry after checking the keychain and state directory." = "El estado de sincronización no está disponible o está dañado; compruebe el llavero y el directorio de estado e inténtelo de nuevo."
"Sync needs local confirmation." = "La sincronización requiere confirmación local."
"Run this command at a terminal and confirm in the operating system." = "Ejecute este comando en un terminal y confirme en el sistema operativo."
"Sync items must contain between 1 byte and 200 KiB." = "Los elementos de sincronización deben contener entre 1 byte y 200 KiB."
"Sync storage is full; review pending items before retrying." = "El almacenamiento de sincronización está lleno; revise los elementos pendientes antes de volver a intentarlo."
"Ignored a stale sync offer for {name}." = "Se ignoró una propuesta de sincronización obsoleta para {name}."
"Ignored signed approvals: Phase 1 requires local review." = "Se ignoraron las aprobaciones firmadas: la fase 1 requiere revisión local."
"Sync delivery is queued; run `kc sync` to retry." = "El envío de sincronización está en cola; ejecute `kc sync` para reintentarlo."
"Unknown sync peer: {label}." = "Dispositivo de sincronización desconocido: {label}."
"Only the device that created a change sends it; if it is lost, publish a new local change from a remaining copy." = "Solo el dispositivo que creó un cambio lo envía; si se pierde, publique un nuevo cambio local a partir de una copia restante."
"Review sync changes." = "Revisar los cambios de sincronización."
"Review {name} from {peer}: current {current}, proposed {proposed}." = "Revisar {name} de {peer}: huella actual {current}, propuesta {proposed}."
"Select sync items." = "Seleccionar los elementos que se sincronizarán."
"Run `kc sync rm {name}` before deleting this item." = "Ejecute `kc sync rm {name}` antes de eliminar este elemento."
"{sent} sent, {updated} updated, {conflict} conflict, {held} held" = "{sent} enviados, {updated} actualizados, {conflict} conflictos, {held} retenidos"
"Sync {name}: {result}." = "Sincronización de {name}: {result}."
"{names} and {n} more" = "{names} y {n} más"
"kc sync add {names}" = "kc sync add {names}"
"kc sync rm {names}" = "kc sync rm {names}"
"kc sync peer add {label}" = "kc sync peer add {label}"
"kc sync peer rm {label}" = "kc sync peer rm {label}"
"Accept {names} from {devices}; reject {rejected}" = "Aceptar {names} de {devices}; rechazar {rejected}"
"Accept {names} from {devices}" = "Aceptar {names} de {devices}"
"Reject {rejected}" = "Rechazar {rejected}"
"Replace {name} with the value from {device}" = "Reemplazar {name} por el valor de {device}"
"Resolve {name}: keep {choice}" = "Resolver {name}: conservar {choice}"
"Restore {name} to its checkpoint" = "Restaurar {name} a su punto de control"
"Unfreeze sync" = "Reanudar la sincronización"
"Confirm the current value of {name} as its checkpoint" = "Confirmar el valor actual de {name} como su punto de control"
"Ignored a sync offer from disabled or blocked peer {peer}." = "Se ignoró una oferta de sincronización del dispositivo desactivado o bloqueado {peer}."
"Sync item held; run `kc sync review`." = "Elemento de sincronización retenido; ejecuta `kc sync review`."
"{name} is in conflict; settle it with `kc sync resolve {name}` first." = "{name} está en conflicto; resuélvelo primero con `kc sync resolve {name}`."
"{name} changed on this device meanwhile and is now a conflict; settle it with `kc sync resolve {name}`." = "{name} cambió en este dispositivo mientras tanto y ahora está en conflicto; resuélvelo con `kc sync resolve {name}`."
"{name} from {peer} was replaced by a newer change; run `kc sync review` again." = "{name} de {peer} fue reemplazado por un cambio más reciente; ejecuta `kc sync review` de nuevo."
"removed from sync" = "quitado de la sincronización"
"hasn't answered the sync handshake yet" = "aún no ha respondido al saludo de sincronización"
"paused after too many changes" = "en pausa tras demasiados cambios"
"quarantined: {n}" = "en cuarentena: {n}"
"re-offer needed: {n}" = "es necesario volver a proponer: {n}"
"device {label}: {state}" = "dispositivo {label}: {state}"
"Nothing to review." = "No hay nada que revisar."
"Rejected {name}." = "Se rechazó {name}."
"Accepted {name} from {peer}." = "Se aceptó {name} de {peer}."
"Left {name} for later." = "{name} queda para más tarde."
"Added {name} to sync; there is no paired device to offer it to yet." = "Se añadió {name} a la sincronización; todavía no hay ningún dispositivo emparejado al que proponerlo."
"Added {name} to sync and offered it to {n} device; accept it there with `kc sync review`." = "Se añadió {name} a la sincronización y se propuso a {n} dispositivo; acéptelo allí con `kc sync review`."
"Added {name} to sync and offered it to {n} devices; accept it on each with `kc sync review`." = "Se añadió {name} a la sincronización y se propuso a {n} dispositivos; acéptelo en cada uno con `kc sync review`."
"Resolved {name}, keeping {choice}; the other devices review it with `kc sync review`." = "Se resolvió {name} conservando el valor de {choice}; los demás dispositivos lo revisan con `kc sync review`."
"sync is frozen (`kc sync unfreeze`)" = "la sincronización está congelada (`kc sync unfreeze`)"
"sync storage is full" = "el almacenamiento de sincronización está lleno"
"waiting for review on other devices" = "pendiente de revisión en otros dispositivos"
"changes to review here (`kc sync review`)" = "cambios por revisar aquí (`kc sync review`)"
"conflicts to resolve (`kc sync resolve`)" = "conflictos por resolver (`kc sync resolve`)"
"changes queued for delivery (`kc sync`)" = "cambios en cola para entregar (`kc sync`)"
"a device needs attention (`kc sync status`)" = "un dispositivo requiere atención (`kc sync status`)"
"Still pending: {what}." = "Aún pendiente: {what}."
"No polkit authentication agent is running in this session (for example over SSH, or on a desktop without one such as hyprpolkitagent or polkit-gnome). Run this command from a desktop session that has an agent." = "No hay ningún agente de autenticación de polkit en ejecución en esta sesión (por ejemplo, por SSH o en un escritorio sin agente como hyprpolkitagent o polkit-gnome). Ejecute este comando desde una sesión de escritorio que tenga un agente."
"The operating system couldn't ask for confirmation: {reason}." = "El sistema operativo no pudo pedir la confirmación: {reason}."
