"Show synchronization state without values" = "Afficher l’état de synchronisation sans les valeurs"
"Confirm the current value as the recovery checkpoint" = "Confirmer la valeur actuelle comme point de restauration"
"Add items and offer them to paired devices" = "Ajouter des éléments et les proposer aux appareils associés"
"Offer selected sync items again" = "Proposer à nouveau les éléments synchronisés sélectionnés"
"Remove items from this device's sync set, keeping their values" = "Retirer des éléments de la synchronisation de cet appareil en conservant leurs valeurs"
"Manage the paired devices used for sync" = "Gérer les appareils associés utilisés pour la synchronisation"
"Review proposals and held changes" = "Examiner les propositions et les modifications en attente"
"Resolve a conflict with a new version" = "Résoudre un conflit avec une nouvelle version"
"Restore the recovery checkpoint" = "Restaurer le point de récupération"
"Hold all incoming sync changes" = "Mettre en attente toutes les modifications de synchronisation entrantes"
"Resume sync after local confirmation" = "Reprendre la synchronisation après confirmation locale"
"Sync state is unavailable or damaged; retry after checking the keychain and state directory." = "L’état de synchronisation est indisponible ou endommagé ; vérifiez le trousseau et le dossier d’état, puis réessayez."
"Sync needs local confirmation." = "La synchronisation nécessite une confirmation locale."
"Run this command at a terminal and confirm in the operating system." = "Exécutez cette commande dans un terminal et confirmez dans le système d’exploitation."
"Sync items must contain between 1 byte and 200 KiB." = "Les éléments à synchroniser doivent contenir entre 1 octet et 200 KiB."
"Sync storage is full; review pending items before retrying." = "Le stockage de synchronisation est plein ; examinez les éléments en attente avant de réessayer."
"Ignored a stale sync offer for {name}." = "Proposition de synchronisation obsolète pour {name} ignorée."
"Ignored signed approvals: Phase 1 requires local review." = "Approbations signées ignorées : la phase 1 nécessite une vérification locale."
"Sync delivery is queued; run `kc sync` to retry." = "La transmission est en attente ; exécutez `kc sync` pour réessayer."
"Unknown sync peer: {label}." = "Appareil de synchronisation inconnu : {label}."
"Only the device that created a change sends it; if it is lost, publish a new local change from a remaining copy." = "Seul l’appareil à l’origine d’une modification l’envoie ; s’il est perdu, publiez une nouvelle modification locale depuis une copie restante."
"Review sync changes." = "Examiner les modifications de synchronisation."
"Review {name} from {peer}: current {current}, proposed {proposed}." = "Examiner {name} de {peer} : empreinte actuelle {current}, proposée {proposed}."
"Select sync items." = "Sélectionner les éléments à synchroniser."
"Run `kc sync rm {name}` before deleting this item." = "Exécutez `kc sync rm {name}` avant de supprimer cet élément."
"{sent} sent, {updated} updated, {conflict} conflict, {held} held" = "{sent} envoyés, {updated} mis à jour, {conflict} conflits, {held} en attente"
"Sync {name}: {result}." = "Synchronisation {name} : {result}."
"{names} and {n} more" = "{names} et {n} autres"
"kc sync add {names}" = "kc sync add {names}"
"kc sync rm {names}" = "kc sync rm {names}"
"kc sync peer add {label}" = "kc sync peer add {label}"
"kc sync peer rm {label}" = "kc sync peer rm {label}"
"Accept {names} from {devices}; reject {rejected}" = "Accepter {names} de {devices} ; refuser {rejected}"
"Replace {name} with the value from {device}" = "Remplacer {name} par la valeur de {device}"
"Resolve {name}: keep {choice}" = "Résoudre {name} : conserver {choice}"
"Restore {name} to its checkpoint" = "Restaurer {name} à son point de contrôle"
"Unfreeze sync" = "Reprendre la synchronisation"
"Confirm the current value of {name} as its checkpoint" = "Confirmer la valeur actuelle de {name} comme point de contrôle"
"Ignored a sync offer from disabled or blocked peer {peer}." = "Offre de synchronisation ignorée : appareil {peer} désactivé ou bloqué."
"Sync item held; run `kc sync review`." = "Élément de synchronisation en attente ; exécutez `kc sync review`."
