"this device paired with {label}; if the other side reports a failure, run `kc peers rm {word}` here and pair again" = "このデバイスは {label} とペアリングしました。相手側で失敗が報告された場合は、ここで `kc peers rm {word}` を実行して再度ペアリングしてください"
"this device's inbox entry in the keychain is damaged" = "キーチェーン内のこのデバイスの受信箱エントリーが破損しています"
"this device's inbox was set up with another kc config directory, which holds its paired devices" = "このデバイスの受信箱は別の kc 設定ディレクトリで作成されており、そこにペアリング済みデバイスの情報があります"
"this device's key in the keychain is damaged" = "キーチェーン内のこのデバイスの鍵が破損しています"
"this device's key or inbox changed while pairing (`kc device rotate`?); pair again" = "ペアリング中にこのデバイスの鍵または受信箱が変更されました(`kc device rotate`?)。再度ペアリングしてください"
"this inbox already accepts 16 devices; unpair some with `kc peers rm`" = "この受信箱は既に 16 台のデバイスを受け付けています。`kc peers rm` で一部のペアリングを解除してください"
"this needs a pairing code (3 words), but a transfer code was entered" = "ペアリングコード(3 単語)が必要ですが、転送コードが入力されました"
"this needs a person at a terminal, and kc never prompts without one" = "これには端末を操作する人が必要です。端末がなければ kc はプロンプトを表示しません"
"this needs a person at a terminal:" = "これには端末を操作する人が必要です:"
"this needs a transfer code (2 words), but a pairing code was entered" = "転送コード(2 単語)が必要ですが、ペアリングコードが入力されました"
"timed out" = "タイムアウトしました"
"timed out waiting for the other side" = "相手側の待機中にタイムアウトしました"
"too many invalid codes" = "無効なコードが多すぎます"
"try again" = "再試行してください"
"try again in {seconds} s" = "{seconds} 秒後に再試行してください"
"unchanged (same value)" = "変更なし(同じ値)"
"unexpected argument (not shown, in case it is a secret){suggestion}. Values are never taken from arguments" = "予期しない引数です(秘密情報の可能性があるため表示しません){suggestion}。値を引数から受け取ることはありません"
"unexpected status {status}" = "予期しないステータス {status}"
"unknown command '{command}'{suggestion}" = "不明なコマンド '{command}'{suggestion}"
"unknown command (not shown){suggestion}" = "不明なコマンド(表示しません){suggestion}"
"unknown keys: {keys}" = "不明なキー: {keys}"
"unknown option '{arg}'{suggestion}" = "不明なオプション '{arg}'{suggestion}"
"unsupported cipher suite {suite}" = "未対応の暗号スイート {suite}"
"unsupported message version {version}" = "未対応のメッセージバージョン {version}"
"use https://" = "https:// を使ってください"
"use that directory (KC_CONFIG_DIR), or run `kc device rotate` to start over with this one" = "そのディレクトリを使う(KC_CONFIG_DIR)か、`kc device rotate` を実行してこのディレクトリでやり直してください"
"warning: {detail}" = "警告: {detail}"
"word {position} belongs at a different position; check the order of the words" = "{position} 番目の単語は別の位置のものです。単語の順序を確認してください"
"word {position} is not a code word; check its spelling" = "{position} 番目の単語はコードの単語ではありません。綴りを確認してください"
"word {position} is not a code word; did you mean {word}?" = "{position} 番目の単語はコードの単語ではありません。{word} のことですか?"
"wrong code, or someone interfered with the exchange" = "コードが間違っているか、誰かが交換に干渉しました"
"wrong number of values for {arg}" = "{arg} の値の数が正しくありません"
"yes" = "あり"
"{arg} can't be used with {other}" = "{arg} は {other} と同時に使用できません"
"{count} keychain items match service {service}; pass an account to pick one: {candidates}" = "サービス {service} に一致するキーチェーン項目が {count} 件あります。アカウントを指定して選んでください: {candidates}"
"{file} isn't a bundle file (line {line}): expected items = [\"NAME\", …]" = "{file} はバンドルファイルではありません({line} 行目): items = [\"NAME\", …] の形式が必要です"
"{file} isn't a bundle file: expected items = [\"NAME\", …]" = "{file} はバンドルファイルではありません: items = [\"NAME\", …] の形式が必要です"
"{label} no longer accepts messages from this device" = "{label} はこのデバイスからのメッセージを受け付けなくなりました"
"{label}'s inbox is full: at most 10 messages (2 MiB) from each device, and 20 in all, wait there" = "{label} の受信箱が満杯です: 各デバイスから最大 10 件(2 MiB)、合計 20 件までです。相手側で受信するまでお待ちください"
"{label}: invalid token slot" = "{label}: 無効なトークンスロット"
"{label}: invalid writer id" = "{label}: 無効な書き込み元 ID"
"{label}: the fingerprint doesn't match the key" = "{label}: フィンガープリントが鍵と一致しません"
"{name} already exists here with a different value." = "{name} は既に別の値でここに存在します。"
"{name} already has this value." = "{name} は既にこの値です。"
"{name} contains a NUL byte, which an environment variable can't hold" = "{name} に NUL バイトが含まれており、環境変数に格納できません"
"{name} isn't UTF-8 text, which Windows environment variables need" = "{name} が UTF-8 テキストではありません。Windows の環境変数には UTF-8 が必要です"
"{n} items are too many for one transfer: the receiving device confirms each one, and that receipt must fit in 16 KiB" = "{n} 件は1回の転送には多すぎます: 受信側デバイスは各項目を確認し、その受領確認は 16 KiB に収まる必要があります"
"{n} message waiting in the inbox will be lost; run `kc inbox` first to keep them." = "受信箱で待機中の {n} 件のメッセージは失われます。保持するには先に `kc inbox` を実行してください。"
"{n} messages waiting in the inbox will be lost; run `kc inbox` first to keep them." = "受信箱で待機中の {n} 件のメッセージは失われます。保持するには先に `kc inbox` を実行してください。"
"{n}; the index is out of date ({stale} stale, {missing} missing): run `kc doctor --reindex`" = "{n}。索引が古くなっています(古い {stale} 件、欠落 {missing} 件): `kc doctor --reindex` を実行してください"
"{n}; the index matches the keychain" = "{n}。索引はキーチェーンと一致しています"
"{path} is a directory" = "{path} はディレクトリです"
"{path} is damaged: {why}" = "{path} が破損しています: {why}"
"{path} is invalid (line {line}): {why}" = "{path} が無効です({line} 行目): {why}"
"{path} is invalid: {why}" = "{path} が無効です: {why}"
"{path} is {size} bytes; the limit is {limit}" = "{path} は {size} バイトです。上限は {limit} です"
"{path}: {detail}. Run `kc reindex` to rebuild it from the keychain" = "{path}: {detail}。`kc reindex` を実行してキーチェーンから再構築してください"
"{url} is plain http (TLS off)" = "{url} は平文 http です(TLS なし)"
"{url} speaks protocol {theirs}, this kc speaks {ours}" = "{url} はプロトコル {theirs}、この kc はプロトコル {ours} です"
"{var} is not valid UTF-8" = "{var} が有効な UTF-8 ではありません"
"{what} is too large for the relay" = "{what} は中継サーバーには大きすぎます"
"↑↓ to move, enter to select, type to filter" = "↑↓: 移動、Enter: 選択、入力で絞り込み"
"Accept" = "受け入れる"
"Reject" = "拒否する"
"Leave for later" = "後で確認"
"this device" = "このデバイス"
"in sync" = "同期済み"
"held" = "保留中"
"conflict" = "競合"
"proposal" = "提案"
"re-offer needed" = "再提案が必要"
"frozen" = "同期停止中"
"awaiting review" = "確認待ち"
"Synchronize selected items with paired devices" = "選択した項目をペア設定済みデバイスと同期"
"Show synchronization state without values" = "値を表示せずに同期状態を確認"
"Confirm the current value as the recovery checkpoint" = "現在の値を復元用チェックポイントとして確認"
"Add items and offer them to paired devices" = "項目を追加してペア設定済みデバイスに提案"
"Offer selected sync items again" = "選択した同期項目を再提案"
"Remove items from this device's sync set, keeping their values" = "値を残してこのデバイスの同期対象から外す"
"Manage the paired devices used for sync" = "同期に使うペア設定済みデバイスを管理"
"Review proposals and held changes" = "提案と保留中の変更を確認"
"Resolve a conflict with a new version" = "新しいバージョンで競合を解決"
"Restore the recovery checkpoint" = "復元用チェックポイントに戻す"
"Hold all incoming sync changes" = "受信した同期変更をすべて保留"
"Resume sync after local confirmation" = "このデバイスで確認して同期を再開"
"Sync state is unavailable or damaged; retry after checking the keychain and state directory." = "同期状態を読み取れないか、破損しています。キーチェーンと状態ディレクトリを確認して再試行してください。"
"Sync needs local confirmation." = "同期にはこのデバイスでの本人確認が必要です。"
"Run this command at a terminal and confirm in the operating system." = "ターミナルでこのコマンドを実行し、OSの本人確認を完了してください。"
"Sync items must contain between 1 byte and 200 KiB." = "同期する値のサイズは1バイト以上200 KiB以下である必要があります。"
"Sync storage is full; review pending items before retrying." = "同期用の保存領域がいっぱいです。保留中の項目を確認してから再試行してください。"
"Ignored a stale sync offer for {name}." = "{name} の古い世代の同期提案を無視しました。"
"Ignored signed approvals: Phase 1 requires local review." = "署名付き承認を無視しました。フェーズ1ではこのデバイスでの確認が必要です。"
"Sync delivery is queued; run `kc sync` to retry." = "同期の送信が待機中です。`kc sync` で再試行してください。"
"Unknown sync peer: {label}." = "同期相手が見つかりません: {label}。"
"Only the device that created a change sends it; if it is lost, publish a new local change from a remaining copy." = "変更は作成元のデバイスだけが送信します。そのデバイスを失った場合は、残っているコピーから新しいローカル変更を作成してください。"
"Review sync changes." = "同期の変更を確認してください。"
"Review {name} from {peer}: current {current}, proposed {proposed}." = "{peer} からの {name} を確認: 現在 {current}、提案 {proposed}。"
"Select sync items." = "同期する項目を選択してください。"
"Run `kc sync rm {name}` before deleting this item." = "この項目を削除する前に `kc sync rm {name}` を実行してください。"
"{sent} sent, {updated} updated, {conflict} conflict, {held} held" = "送信 {sent}件、更新 {updated}件、競合 {conflict}件、保留 {held}件"
"Sync {name}: {result}." = "同期 {name}: {result}。"
"{names} and {n} more" = "{names}、ほか{n}件"
"kc sync add {names}" = "kc sync add {names}"
"kc sync rm {names}" = "kc sync rm {names}"
"kc sync peer add {label}" = "kc sync peer add {label}"
"kc sync peer rm {label}" = "kc sync peer rm {label}"
"Accept {names} from {devices}; reject {rejected}" = "{devices}からの{names}を承認し、{rejected}を拒否"
"Accept {names} from {devices}" = "{devices}からの{names}を承認"
"Reject {rejected}" = "{rejected}を拒否"
"Replace {name} with the value from {device}" = "{name}を{device}の値で置き換える"
"Resolve {name}: keep {choice}" = "{name}を解決：{choice}を保持"
"Restore {name} to its checkpoint" = "{name}をチェックポイントに戻す"
"Unfreeze sync" = "同期の凍結を解除"
"Confirm the current value of {name} as its checkpoint" = "{name}の現在の値をチェックポイントとして確認"
"Ignored a sync offer from disabled or blocked peer {peer}." = "無効またはブロックされたデバイス{peer}からの同期提案を無視しました。"
"Sync item held; run `kc sync review`." = "同期項目を保留しました。`kc sync review`を実行してください。"
"{name} is in conflict; settle it with `kc sync resolve {name}` first." = "{name} は競合中です。先に `kc sync resolve {name}` で解決してください。"
