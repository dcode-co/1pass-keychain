[package]
name = "kc-store"
description = "1pass keychain: OS keychain adapter (macOS Keychain, Linux Secret Service, Windows Credential Manager) and local index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Exposes `kc_store::testing::MemoryBackend` so crates that depend on kc-store can test
# against an in-memory keychain. Never enable it for release builds.
test-util = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# macOS and Windows: keyring-core plus one store crate per OS, chosen explicitly. The `keyring`
# v1 wrapper is deliberately not used (see the crate docs on the silent mock-store trap).
keyring-core = "1"
directories = "6"
fd-lock = "4"
humantime = "2"
rand.workspace = true
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Already used by fd-lock; kc-store needs the effective uid for the user-wide lock.
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
regex = "1"

# Linux / BSD: the Secret Service, driven directly with D-Bus method calls. The keyring store
# crates for it (zbus-/dbus-secret-service-keyring-store) unlock locked items by themselves,
# which shows a password prompt, and client libraries read D-Bus properties, which can crash
# gnome-keyring; kc must do neither. The crypto crates implement the encrypted session
# (`dh-ietf1024-sha256-aes128-cbc-pkcs7`).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt"] }
aes = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.1", features = ["block-padding", "alloc", "zeroize"] }
crypto-bigint = { version = "0.7", default-features = false, features = ["zeroize"] }
hkdf = "0.12"

[dev-dependencies]
tempfile = "3"
